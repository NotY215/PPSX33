<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PPSX33 Controller Studio</title><style>
:root{color-scheme:dark;--bg:#040810;--panel:#091321;--edge:#1d3459;--cyan:#00e5ff;--text:#ebf5ff;--muted:#68bedc}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font:13px "Segoe UI",Arial}body{background-image:linear-gradient(#14243a33 1px,transparent 1px),linear-gradient(90deg,#14243a33 1px,transparent 1px);background-size:32px 32px}.app{height:100%;display:flex;flex-direction:column}.top{display:flex;align-items:center;gap:18px;padding:12px 18px;border-bottom:1px solid var(--edge);background:#08111eee;flex-wrap:wrap}.brand{font-size:25px;font-weight:800;font-style:italic;color:var(--cyan)}.sub{font-size:10px;letter-spacing:1px;color:var(--muted);line-height:1.7}.actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}button{cursor:pointer;border:1px solid var(--edge);border-radius:6px;color:var(--text);background:linear-gradient(#12243a,#08111e);padding:8px 13px;font-weight:650}button:hover,button:focus-visible{outline:0;border-color:var(--cyan);box-shadow:0 0 12px #00e5ff30;color:var(--cyan)}button.primary{border-color:#007f9b;color:var(--cyan)}.content{flex:1;min-height:0;overflow:auto;padding:12px 18px}.layout{max-width:1250px;margin:auto;display:grid;grid-template-columns:minmax(350px,1fr) minmax(380px,1fr);gap:14px;align-items:start}.card{background:linear-gradient(145deg,#0b1727ee,#050b14f5);border:1px solid var(--edge);border-radius:10px;box-shadow:0 10px 28px #0005;overflow:hidden}.head{display:flex;justify-content:space-between;padding:12px 14px;border-bottom:1px solid #1d345988;font-weight:700;letter-spacing:.7px;font-size:11px;color:var(--muted)}.hint{font-size:11px;color:#7894ad;font-weight:400}.visual{padding:8px 12px 14px}.visual svg{width:100%;height:auto;display:block}.hit{cursor:pointer}.hit:hover .cap,.hit:focus .cap{stroke:var(--cyan);stroke-width:2.5;filter:drop-shadow(0 0 5px #00e5ff88)}.bindings{padding:10px;display:grid;grid-template-columns:1fr 1fr;gap:7px}.row{display:flex;align-items:center;gap:8px;min-width:0;border:1px solid #1d3459a8;border-radius:6px;padding:7px 8px;background:#060d18;cursor:pointer}.row:hover,.row.sel{border-color:var(--cyan);background:#06202a}.name{font-size:11px;flex:1;min-width:0;color:#c9dced}.key{border:1px solid #294a70;border-radius:4px;background:#102137;padding:4px 7px;min-width:75px;text-align:center;color:#bcefff;font-size:11px}.row.sel .key{border-color:var(--cyan)}.status{padding:10px 14px;border-top:1px solid #1d345988;color:#8ba9c3;font-size:11px;min-height:34px}.foot{color:#66849d;font-size:10px;padding:8px 2px}@media(max-width:850px){.layout{grid-template-columns:1fr}.actions{margin-left:0}.content{padding:10px}}@media(max-width:520px){.bindings{grid-template-columns:1fr}.top{padding:10px}}
</style></head><body><div class="app"><header class="top"><div class="brand">PPSX33</div><div class="sub">PLAYSTATION 3 / CONTROLLER STUDIO<br>CLICK A CONTROL OR BINDING TO REASSIGN · ESC TO CANCEL</div><div class="actions"><button id="import">IMPORT</button><button id="export">EXPORT</button><button id="reset">RESET DEFAULTS</button><button id="save" class="primary">SAVE MAP</button><input id="file" type="file" accept=".json,application/json" hidden></div></header><main class="content"><div class="layout"><section class="card"><div class="head"><span>DUALSHOCK-STYLE CONTROLLER</span><span class="hint">LIVE KEY RESPONSE</span></div><div class="visual"><svg viewBox="0 0 600 420" role="img" aria-label="Interactive PlayStation controller"><defs><linearGradient id="shell" x2="0" y2="1"><stop stop-color="#243750"/><stop offset="1" stop-color="#080f1c"/></linearGradient><linearGradient id="cap" x2="0" y2="1"><stop stop-color="#213650"/><stop offset="1" stop-color="#08111e"/></linearGradient></defs><ellipse cx="300" cy="360" rx="215" ry="17" fill="#000" opacity=".5"/><path d="M115 105Q75 112 72 190L56 298Q50 349 91 365Q128 377 151 329L178 268L422 268L449 329Q472 377 509 365Q550 349 544 298L528 190Q525 112 485 105Q421 80 360 96L240 96Q179 80 115 105Z" fill="url(#shell)" stroke="#36557e" stroke-width="2.5"/><path d="M130 115Q84 130 91 210L105 301Q116 335 142 328L183 248Q203 223 235 228L365 228Q397 223 417 248L458 328Q484 335 495 301L509 210Q516 130 470 115Q410 95 360 112L240 112Q190 95 130 115Z" fill="none" stroke="#213e61" stroke-width="2"/><g fill="url(#cap)" stroke="#385879"><rect x="95" y="72" width="80" height="19" rx="5"/><rect x="100" y="95" width="70" height="18" rx="5"/><rect x="425" y="72" width="80" height="19" rx="5"/><rect x="430" y="95" width="70" height="18" rx="5"/></g><g fill="#b5d6ed" font-size="10" text-anchor="middle"><text x="135" y="85">L2</text><text x="135" y="108">L1</text><text x="465" y="85">R2</text><text x="465" y="108">R1</text></g><rect x="223" y="143" width="154" height="86" rx="24" fill="#07101d" stroke="#2c4868"/><g fill="#536f8d"><circle cx="267" cy="174" r="1.5"/><circle cx="277" cy="174" r="1.5"/><circle cx="287" cy="174" r="1.5"/><circle cx="297" cy="174" r="1.5"/><circle cx="307" cy="174" r="1.5"/><circle cx="317" cy="174" r="1.5"/><circle cx="327" cy="174" r="1.5"/><circle cx="267" cy="183" r="1.5"/><circle cx="277" cy="183" r="1.5"/><circle cx="287" cy="183" r="1.5"/><circle cx="297" cy="183" r="1.5"/><circle cx="307" cy="183" r="1.5"/><circle cx="317" cy="183" r="1.5"/><circle cx="327" cy="183" r="1.5"/><circle cx="267" cy="192" r="1.5"/><circle cx="277" cy="192" r="1.5"/><circle cx="287" cy="192" r="1.5"/><circle cx="297" cy="192" r="1.5"/><circle cx="307" cy="192" r="1.5"/><circle cx="317" cy="192" r="1.5"/><circle cx="327" cy="192" r="1.5"/></g>

<script>
const defaults={DpadUp:"NumPad8",DpadDown:"NumPad5",DpadLeft:"NumPad4",DpadRight:"NumPad6",Triangle:"S",Circle:"X",Cross:"Z",Square:"A",L1:"L",R1:"R",L2:"RShiftKey",R2:"RControlKey",Select:"Space",Start:"V",PsButton:"Backspace",LeftStickUp:"Up",LeftStickDown:"Down",LeftStickLeft:"Left",LeftStickRight:"Right",RightStickUp:"U",RightStickDown:"J",RightStickLeft:"H",RightStickRight:"K",L3:"LShiftKey",R3:"LControlKey"};
const controls=[["dpad_up","D-Pad Up","DpadUp"],["dpad_down","D-Pad Down","DpadDown"],["dpad_left","D-Pad Left","DpadLeft"],["dpad_right","D-Pad Right","DpadRight"],["triangle","Triangle","Triangle"],["circle","Circle","Circle"],["cross","Cross","Cross"],["square","Square","Square"],["l1","L1","L1"],["r1","R1","R1"],["l2","L2 / Trigger","L2"],["r2","R2 / Trigger","R2"],["select","SELECT","Select"],["start","START","Start"],["ps","PS Button","PsButton"],["ls_up","Left Stick Up","LeftStickUp"],["ls_down","Left Stick Down","LeftStickDown"],["ls_left","Left Stick Left","LeftStickLeft"],["ls_right","Left Stick Right","LeftStickRight"],["rs_up","Right Stick Up","RightStickUp"],["rs_down","Right Stick Down","RightStickDown"],["rs_left","Right Stick Left","RightStickLeft"],["rs_right","Right Stick Right","RightStickRight"],["l3","L3 · Stick Click","L3"],["r3","R3 · Stick Click","R3"]];
let map={...defaults},selected=null,held=new Set();const pretty=k=>({"RShiftKey":"Right Shift","LShiftKey":"Left Shift","RControlKey":"Right Ctrl","LControlKey":"Left Ctrl","ControlKey":"Ctrl","ShiftKey":"Shift","NumPad8":"Num 8","NumPad5":"Num 5","NumPad4":"Num 4","NumPad6":"Num 6","Space":"Space","Backspace":"Backspace","ArrowUp":"Up","ArrowDown":"Down","ArrowLeft":"Left","ArrowRight":"Right"}[k]||k.replace(/^NumPad/,"Num "));
function status(s){document.getElementById("status").textContent=s}function render(){const root=document.getElementById("bindings");root.innerHTML="";for(const [id,label,key] of controls){const row=document.createElement("div");row.className="row"+(selected===id?" sel":"");row.tabIndex=0;const n=document.createElement("span");n.className="name";n.textContent=label;const k=document.createElement("span");k.className="key";k.textContent=pretty(map[key]||defaults[key]);row.append(n,k);row.onclick=()=>begin(id);row.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();begin(id)}};root.append(row)}}
function begin(id){selected=id;document.querySelectorAll(".hit").forEach(x=>x.style.filter=x.dataset.id===id?"drop-shadow(0 0 8px #00e5ff)":"");render();status("Press a key for "+controls.find(c=>c[0]===id)[1]+". Escape cancels.")}
function send(type){if(window.chrome&&window.chrome.webview)window.chrome.webview.postMessage({type,map})}
function norm(k){return ({" ":"Space","Esc":"Escape","ArrowUp":"Up","ArrowDown":"Down","ArrowLeft":"Left","ArrowRight":"Right","Control":"ControlKey","Shift":"ShiftKey","Alt":"Menu"}[k]||k)}
window.addEventListener("keydown",e=>{if(selected){e.preventDefault();e.stopPropagation();if(e.key==="Escape"){selected=null;render();status("Rebinding cancelled.");return}if(["Control","Shift","Alt","Meta"].includes(e.key))return;const c=controls.find(c=>c[0]===selected);if(c)map[c[2]]=norm(e.key===" "?"Space":e.key);selected=null;render();document.querySelectorAll(".hit").forEach(x=>x.style.filter="");status("Binding updated. Select Save Map to apply it.");send("changed");return}held.add(norm(e.key));updateSticks();if(e.key.startsWith("Arrow")||e.key===" ")e.preventDefault()},true);window.addEventListener("keyup",e=>{held.delete(norm(e.key));updateSticks()});
function down(k){return held.has(k)||held.has(pretty(k))}function updateSticks(){for(const id of ["ls","rs"]){const prefix=id==="ls"?"LeftStick":"RightStick";let x=(down(map[prefix+"Left"])?-1:0)+(down(map[prefix+"Right"])?1:0),y=(down(map[prefix+"Up"])?-1:0)+(down(map[prefix+"Down"])?1:0),l=Math.hypot(x,y)||1;document.getElementById(id+"-cap").setAttribute("cx",x/l*10);document.getElementById(id+"-cap").setAttribute("cy",y/l*10)}}
document.querySelectorAll(".hit").forEach(el=>{el.addEventListener("click",()=>begin(el.dataset.id));el.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();begin(el.dataset.id)}})});
document.getElementById("reset").onclick=()=>{map={...defaults};selected=null;render();status("Default bindings restored. Select Save Map to apply them.");send("changed")};document.getElementById("save").onclick=()=>{send("save");status("Map sent to PPSX33 settings.")};document.getElementById("import").onclick=()=>document.getElementById("file").click();document.getElementById("file").onchange=async e=>{try{const d=JSON.parse(await e.target.files[0].text());for(const c of controls)if(typeof d[c[2]]==="string")map[c[2]]=d[c[2]];render();send("changed");status("Imported key map. Select Save Map to apply it.")}catch{status("Import failed: invalid JSON key map.")}e.target.value=""};document.getElementById("export").onclick=()=>{const a=document.createElement("a"),u=URL.createObjectURL(new Blob([JSON.stringify(map,null,2)],{type:"application/json"}));a.href=u;a.download="ppsx33-key-map.json";a.click();URL.revokeObjectURL(u)};window.loadMap=m=>{map={...defaults,...m};render();updateSticks()};render();
</script></body></html>
