name: validate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tree-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Guard removed C# solution
        run: |
          if [ -f PS3Recomp.sln ]; then echo "PS3Recomp.sln must not exist"; exit 1; fi
          if [ -d src/UI ]; then echo "src/UI C# tree must not exist"; exit 1; fi
          echo "OK: no PS3Recomp.sln / src/UI"
