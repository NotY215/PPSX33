name: validate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore (Windows targeting enabled)
        run: dotnet restore PS3Recomp.sln
